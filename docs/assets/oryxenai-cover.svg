<title id="title">OryxenAI — Your experience. Your voice. Your portfolio.</title>
<desc id="desc">An editorial illustration of personal notes becoming a structured story and a portfolio. Three stages: Discover, Shape, Refine. Illustrative composition, not an application screenshot.</desc>
