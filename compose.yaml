# Local production-like Docker Compose for OryxenAI.
# topology: postgres → migrate → app + worker
#
# Usage:
#   docker compose up --build  — build and start the stack
#   docker compose down -v     — stop, remove containers and volumes

name: oryxenai

x-default-logging: &default-logging
  driver: local

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: oryxenai
      POSTGRES_USER: oryxen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - oryxen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oryxen -d oryxenai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:5544:5432"

  migrate:
    image: oryxenai:${ORYXENAI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    logging: *default-logging
    env_file:
      - .env
    environment:
      DB_HOST_OVERRIDE: postgres
      DB_PORT_OVERRIDE: "5432"
      OryxenAI_CONFIG_OVERLAY: config/app.docker.toml
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    image: oryxenai:${ORYXENAI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      DB_HOST_OVERRIDE: postgres
      DB_PORT_OVERRIDE: "5432"
      OryxenAI_CONFIG_OVERLAY: config/app.docker.toml
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./output:/app/output
      - oryxen_archive_storage:/app/.workspace/archive-storage
      - oryxen_archive_artifacts:/app/.workspace/archive-artifacts
      - oryxen_archive_generation:/app/.workspace/archive-generation
      - oryxen_archive_checkpoints:/app/.workspace/archive-checkpoints
      - oryxen_archive_workspaces:/app/.workspace/archive-workspaces
    command: ["uvicorn", "oryxenai.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    image: oryxenai:${ORYXENAI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      DB_HOST_OVERRIDE: postgres
      DB_PORT_OVERRIDE: "5432"
      OryxenAI_CONFIG_OVERLAY: config/app.docker.toml
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "oryxenai.jobs.worker"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from sqlalchemy import text; from oryxenai.core.settings import get_settings; from oryxenai.db.session import get_engine; import asyncio; e = get_engine(get_settings()); asyncio.run(e.connect().__aenter__()); asyncio.run(e.dispose())\""]
      interval: 15s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  oryxen_pgdata:
  # Reuse the existing volume so historical preview objects remain available
  # to account/project deletion cleanup.
  oryxen_archive_storage:
    name: ${ORYXENAI_ARCHIVE_STORAGE_VOLUME:-oryxenai_oryxen_codegen_preview}
  # Keep prior data volumes attached only to the application process so
  # account/project deletion can remove previously generated records.
  oryxen_archive_artifacts:
    name: ${ORYXENAI_ARCHIVE_ARTIFACTS_VOLUME:-oryxenai_oryxen_codegen_artifacts}
  oryxen_archive_generation:
    name: ${ORYXENAI_ARCHIVE_GENERATION_VOLUME:-oryxenai_oryxen_codegen_generation}
  oryxen_archive_checkpoints:
    name: ${ORYXENAI_ARCHIVE_CHECKPOINTS_VOLUME:-oryxenai_oryxen_codegen_checkpoints}
  oryxen_archive_workspaces:
    name: ${ORYXENAI_ARCHIVE_WORKSPACES_VOLUME:-oryxenai_oryxen_codegen_workspaces}
