# Azure VM production overlay template.
#
# azure-deploy.sh renders this file to the ignored
# config/app.production.local.toml file. Replace the placeholders only in the
# VM-local rendered copy. Secrets still come only from .env.

[app]
env = "production"
host = "0.0.0.0"
enable_dev_ui = false
enable_product_preact_shell = true

[client_diagnostics]
enabled = false

[auth]
required = true
pipeline_mode = "attached"
development_harness_mode = "attached"
admission_mode = "allowlist"
primary_origin = "https://<APP_HOST>"
allowed_origins = ["https://<APP_HOST>"]

[worker]
concurrency = 1

[artifact_storage]
# Preserve the configured provider boundary for deletion of historical typed
# artifact references; production has no object-store credentials configured.
provider = "local_fs"
endpoint_url = ""
bucket = ""
region = ""
prefix = "temporary"
require_lifecycle = false
access_key_env = ""
secret_key_env = ""

[archive_storage]
# Compatibility paths are mounted only for deletion cleanup of prior outputs.
provider = "local_fs"
root = "/app/.workspace/archive-storage"
prefix = "preview"
artifact_root = "/app/.workspace/archive-artifacts"
generation_root = "/app/.workspace/archive-generation"
checkpoint_root = "/app/.workspace/archive-checkpoints"
workspace_root = "/app/.workspace/archive-workspaces"
export_root = "/app/output/archive-exports"
handoff_root = "/app/.workspace/archive-handoffs"
handoff_mirror_root = "/app/output/archive-handoff-mirrors"
