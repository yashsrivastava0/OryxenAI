# Test overlay — loaded after config/app.toml during integration/worker tests.
# Uses a dedicated test database so tests never touch the application database.
# Secrets come from .env (POSTGRES_PASSWORD), CI sets POSTGRES_PASSWORD=oryxen_test.

[database]
# The base config/app.toml default (port 5544) has no listener on this
# machine; the actual local PostgreSQL server used for both native
# development and testing runs on 5432 (see config/app.native.toml). Without
# this override, every integration/worker test silently skipped with
# "PostgreSQL unavailable" instead of running.
host = "127.0.0.1"
port = 5432
database = "oryxenai_test"

[database.pool]
pool_size = 3          # smaller pool for test isolation
max_overflow = 5

[artifact_storage]
# Tests inject MemoryArtifactStore and never contact an object provider.
provider = "memory"
require_lifecycle = false

[build_preparation]
fixture_enabled = true
fixture_output_dir = "output"
debug_mirror_enabled = true
reasoning_enabled = false

[code_generator_development]
enabled = true
input_root = ".workspace/code-generator-development-test"
# Legacy fixtures keep exercising read compatibility. Focused v4 tests opt in
# explicitly and assert that the committed live configuration is v4.
pipeline_contract_version = "code-generator-v3"

[code_generator_acquisition]
materials_root = ".workspace/code-generator-materials-test"
offline_resource_root = "tests/fixtures/code_generator_resources"
prefer_resource_scout_model = false
allowlist_image_providers = []

[code_generator_dependencies]
workspaces_root = ".workspace/code-generator-workspaces-test"
npm_executable = "npm.cmd"
npm_cache_root = ".workspace/npm-cache"
allow_network_install = false
allow_install_scripts = false

[code_generator_generation]
workspace_root = ".workspace/code-generator-generation-test"
checkpoint_root = ".workspace/code-generator-checkpoints-test"
use_real_typecheck = false
max_concurrency = 1

[code_generator_verification]
enabled = true
preview_root = ".workspace/code-generator-preview-test"
preview_base_url = "http://127.0.0.1:4174/preview"
preview_host = "127.0.0.1"
preview_port = 4175
preview_parent_origin = "http://test"
preview_embed_origins = ["http://test"]
preview_public_readback_required = false
preview_storage_provider = "memory"
preview_storage_prefix = "preview"
export_timezone = "Asia/Kolkata"
browser_timeout_ms = 5000
runtime_timeout_ms = 5000
install_timeout_seconds = 60.0
typecheck_timeout_seconds = 60.0
build_timeout_seconds = 60.0

[resource_providers]
registries_enabled = false

[auth]
# Unit/API tests use injected JWT/provider doubles and never call Supabase.
# This is not an authorization bypass: live auth remains enabled and no fake
# identity is accepted by the application.
enabled = true
required = false
pipeline_mode = "attached"
development_harness_mode = "attached"
admission_mode = "allowlist"
primary_origin = "http://test"
allowed_origins = ["http://test"]

[worker]
polling_interval = 0.25    # faster polling for test speed
heartbeat_interval = 5.0
claim_batch_size = 10
concurrency = 2
shutdown_grace = 3.0

[worker.job]
handler_timeout = 10.0      # short timeout for deterministic test handlers
lease_duration = 5.0

[worker.job.kind_timeouts]
# Keep the production model-backed call graphs configuration-valid while
# retaining the short default for deterministic probe/test handlers.
"discovery.understand_and_question" = 300.0
"discovery.build_or_revise_brief" = 300.0
"discovery.prepare_questions" = 300.0
"discovery.build_brief" = 300.0
"content_architect.build" = 900.0
"visual_design_director.build" = 900.0
"build_preparation.prepare" = 1800.0

[worker.retry]
max_attempts = 3
base_delay = 0.01
max_delay = 0.5
jitter = false               # deterministic for tests
