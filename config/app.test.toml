# Test overlay — loaded after config/app.toml during integration/worker tests.
# Uses a dedicated test database so tests never touch the application database.
# Secrets come from .env (POSTGRES_PASSWORD), CI sets POSTGRES_PASSWORD=oryxen_test.

[database]
# The base config/app.toml default (port 5544) has no listener on this
# machine; the actual local PostgreSQL server used for both native
# development and testing runs on 5432 (see config/app.native.toml). Without
# this override, every integration/worker test silently skipped with
# "PostgreSQL unavailable" instead of running.
host = "127.0.0.1"
port = 5432
database = "oryxenai_test"

[database.pool]
pool_size = 3          # smaller pool for test isolation
max_overflow = 5

[client_diagnostics]
enabled = false
output_root = ".workspace/test-diagnostics"

[model_cache]
# Unit/integration tests use short-lived isolated rows and a temporary-safe
# local export root when they opt into the durable cache explicitly.
enabled = true
ttl_seconds = 3600
lease_seconds = 30
wait_seconds = 2.0
output_root = ".workspace/model-cache-output-test"
export_enabled = false

[auth]
# Unit/API tests use injected JWT/provider doubles and never call Supabase.
# This is not an authorization bypass: live auth remains enabled and no fake
# identity is accepted by the application.
enabled = true
required = false
pipeline_mode = "attached"
development_harness_mode = "attached"
admission_mode = "allowlist"
primary_origin = "http://test"
allowed_origins = ["http://test"]

[worker]
polling_interval = 0.25    # faster polling for test speed
heartbeat_interval = 5.0
claim_batch_size = 10
concurrency = 2
shutdown_grace = 3.0

[worker.job]
handler_timeout = 10.0      # short timeout for deterministic test handlers
lease_duration = 5.0

[worker.job.kind_timeouts]
"discovery.understand_and_question" = 300.0
"discovery.build_or_revise_brief" = 300.0
"discovery.prepare_questions" = 300.0
"discovery.build_brief" = 300.0
"content_architect.build" = 900.0

[worker.retry]
max_attempts = 3
agent_job_max_attempts = 2
base_delay = 0.01
max_delay = 0.5
jitter = false               # deterministic for tests

[archive_storage]
provider = "memory"
root = ".workspace/archive-storage-test"
prefix = "preview"
artifact_root = ".workspace/archive-artifacts-test"
generation_root = ".workspace/archive-generation-test"
checkpoint_root = ".workspace/archive-checkpoints-test"
workspace_root = ".workspace/archive-workspaces-test"
export_root = ".workspace/archive-exports-test"
handoff_root = ".workspace/archive-handoffs-test"
handoff_mirror_root = ".workspace/archive-handoff-mirrors-test"

[artifact_storage]
# Tests inject MemoryArtifactStore and never contact an object provider.
provider = "memory"
require_lifecycle = false
