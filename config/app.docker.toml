# Docker overlay — loaded after config/app.toml inside containers.
# Overrides database host/port for the Compose service network.
# Secrets come from .env (mounted via env_file in compose.yaml).

[database]
host = "postgres"
port = 5432
# When running locally against Docker, set DB_HOST_OVERRIDE / DB_PORT_OVERRIDE
# environment variables; this file is only used inside the containers.
