# Docker overlay — loaded after config/app.toml inside containers.
# Overrides database host/port for the Compose service network.
# Secrets come from .env (mounted via env_file in compose.yaml).

[app]
# The deployment overlay serves the product shell only; development harnesses
# and fixture APIs are not registered in this environment.
enable_dev_ui = false

[client_diagnostics]
# Browser trace ingestion is a local development aid and is disabled in the
# deployment-like overlay.
enabled = false

[database]
host = "postgres"
port = 5432
# When running locally against Docker, set DB_HOST_OVERRIDE / DB_PORT_OVERRIDE
# environment variables; this file is only used inside the containers.

[auth]
required = true
pipeline_mode = "attached"
development_harness_mode = "attached"
# The deployed product accepts any verified Google identity until the
# database-owned 15-user normal capacity is full.  Bootstrap administrators
# remain controlled by ORYXENAI_ADMIN_BOOTSTRAP_EMAILS.
admission_mode = "open"

[artifact_storage]
# Keep the configured private-object coordinates for historical references
# that administrator deletion still needs to remove.
provider = "r2_s3"
endpoint_url = "https://d20ab3b9469c0c46731f758a03af4e3c.r2.cloudflarestorage.com"
bucket = "oryxenai-build-preparation"
region = "auto"
prefix = "temporary"
require_lifecycle = true


[archive_storage]
# Compatibility paths are mounted only for deletion cleanup of prior outputs.
provider = "local_fs"
root = "/app/.workspace/archive-storage"
prefix = "preview"
artifact_root = "/app/.workspace/archive-artifacts"
generation_root = "/app/.workspace/archive-generation"
checkpoint_root = "/app/.workspace/archive-checkpoints"
workspace_root = "/app/.workspace/archive-workspaces"
export_root = "/app/output/archive-exports"
handoff_root = "/app/.workspace/archive-handoffs"
handoff_mirror_root = "/app/output/archive-handoff-mirrors"
