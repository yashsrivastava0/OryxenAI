# Docker overlay — loaded after config/app.toml inside containers.
# Overrides database host/port for the Compose service network.
# Secrets come from .env (mounted via env_file in compose.yaml).

[database]
host = "postgres"
port = 5432
# When running locally against Docker, set DB_HOST_OVERRIDE / DB_PORT_OVERRIDE
# environment variables; this file is only used inside the containers.

[artifact_storage]
# Private temporary Build Preparation packs. Credentials remain in .env.
provider = "r2_s3"
endpoint_url = "https://d20ab3b9469c0c46731f758a03af4e3c.r2.cloudflarestorage.com"
bucket = "oryxenai-build-preparation"
region = "auto"
prefix = "temporary"
require_lifecycle = true

[build_preparation]
# Render disks are ephemeral; the verified ZIP remains the only deployment
# artifact in normal session/worker execution.
debug_mirror_enabled = false
# The detached developer fixture writes timestamped local results into the
# ignored host-mounted output/ directory.
fixture_output_dir = "/app/output"
fixture_debug_mirror_enabled = true

[code_generator_development]
enabled = false

[code_generator_acquisition]
materials_root = "/app/.workspace/code-generator-materials"

[code_generator_dependencies]
workspaces_root = "/app/.workspace/code-generator-workspaces"

[code_generator_generation]
workspace_root = "/app/.workspace/code-generator-generation"
checkpoint_root = "/app/.workspace/code-generator-checkpoints"

[code_generator_verification]
enabled = false
preview_root = "/app/.workspace/code-generator-preview"
preview_base_url = "http://localhost:4174/preview"
preview_host = "0.0.0.0"
preview_port = 4174
browser_executable = "/usr/bin/chromium"
