# OryxenAI application configuration (non-secret, committed).
# Secrets live ONLY in the root .env file. This file contains no credentials.
#
# Overlay files:
#   config/app.docker.toml  — Docker-specific overrides (loaded after this file)
#   config/app.test.toml     — test-specific overrides

[app]
name = "OryxenAI"
env = "local"          # local | staging | production
host = "127.0.0.1"     # bind host for direct uv run
port = 8000
log_level = "INFO"     # DEBUG | INFO | WARNING | ERROR
enable_dev_ui = true   # enable the separate diagnostic/developer harnesses
# /app serves the Preact studio (frontend/, npm run build). There is no legacy
# static pipeline fallback: a missing bundle is a startup/deployment error.
enable_product_preact_shell = true

[database]
# Non-secret connection parameters. The PASSWORD is read from .env
# (POSTGRES_PASSWORD) and never appears here.
host = "localhost"
port = 5544
database = "oryxenai"
user = "oryxen"
# Optional full URL override. When non-empty, it is used verbatim.
url = ""

[database.pool]
# Pool settings for the async SQLAlchemy engine.
pool_size = 5          # number of persistent connections per process
max_overflow = 10      # additional connections allowed under load
pool_timeout = 30      # seconds to wait for a connection from the pool
pool_recycle = 3600    # seconds before a connection is recycled (-1 = never)

[worker]
# Background job worker settings.
polling_interval = 0.5        # seconds between poll cycles when idle
heartbeat_interval = 30.0     # seconds between heartbeat writes
claim_batch_size = 5           # max jobs claimed per poll
concurrency = 4                # max concurrent handlers (1 = serial)
model_lane_concurrency = 4    # concurrent model jobs across workers
shutdown_grace = 10.0          # seconds to finish active jobs at shutdown

[worker.job]
# Job execution behaviour.
handler_timeout = 300.0        # max seconds a handler may run
lease_duration = 120.0         # seconds before a claimed job is considered stale

[worker.job.kind_timeouts]
# The retained model-backed jobs have bounded call graphs.
"discovery.understand_and_question" = 210.0
"discovery.build_or_revise_brief" = 360.0
"discovery.prepare_questions" = 210.0
"discovery.build_brief" = 360.0
"content_architect.build" = 900.0
"code_generator.build" = 600.0

[worker.retry]
# Retry scheduling for transient failures.
max_attempts = 3               # total attempts (1 initial + 2 retries)
agent_job_max_attempts = 2     # one initial execution plus one redelivery
base_delay = 1.0               # base delay in seconds (doubled each retry)
max_delay = 60.0               # cap on exponential backoff
jitter = true                  # add random jitter to retry delays

[api]
# API-level settings.
max_input_bytes = 262144       # 256 KB payload limit for request bodies

[diagnostics]
# Heartbeat monitoring.
heartbeat_staleness = 60.0     # seconds since last heartbeat before worker is stale

[client_diagnostics]
# Local-only browser trace: request paths/status/timing, never request bodies.
enabled = true
output_root = "output/test-diagnostics"
max_events_per_batch = 100

[model_cache]
# Durable, owner/session-scoped structured model-result cache. Six months is
# intentional: storage is inexpensive compared with a repeated model call,
# while prompt/model fingerprints prevent stale contracts from colliding.
enabled = true
ttl_seconds = 15552000         # 180 days
lease_seconds = 900             # 15 minutes single-flight lease
wait_seconds = 60.0             # bounded wait for another worker's result
output_root = "output"
export_enabled = true

[auth]
# Phase 1 Supabase/Google policy. Provider coordinates and admission lists
# remain in .env; no secret is stored in committed configuration.
provider = "supabase"
enabled = true
required = false                # production and the Docker overlay require it
# The normal product uses the retained portfolio workflow.
pipeline_mode = "attached"
# Later-stage fixture/control-room pages remain anonymous local development
# harnesses. This never relaxes session API ownership or the /app boundary.
development_harness_mode = "detached" # attached | detached (local only)
# Public Google registration is the product default.  Set this to
# "allowlist" in a restricted environment; the database still caps normal
# users at 15 in either mode.
admission_mode = "open"
primary_origin = "http://localhost:8000"
allowed_origins = ["http://localhost:8000", "http://127.0.0.1:8000"]
audience = "authenticated"
issuer_path = "/auth/v1"
allowed_algorithms = ["RS256", "ES256"]
sign_in_path = "/sign-in"
callback_path = "/auth/callback"
access_not_approved_path = "/access-not-approved"
account_unavailable_path = "/account-unavailable"
onboarding_path = "/onboarding"
app_path = "/app"
admin_path = "/admin"
normal_user_limit = 15
bootstrap_admin_count = 2
clock_skew_seconds = 30
jwks_cache_ttl_seconds = 300
http_timeout_seconds = 5.0
max_token_bytes = 8192

[discovery]
# Generous admission limits protect model context and response times.
max_questions = 3
max_answer_chars = 10000
max_input_chars = 200000

[code_generator]
# Generated-portfolio pipeline (Studio). One build per session at a time.
theme_id = "editorial-forest/v1"
max_body_bytes = 262144            # generated <body> markup limit
max_versions_per_session = 40      # older ready versions are pruned beyond this
max_instruction_chars = 1500       # one chat request
max_changes_per_hour = 30          # chat edits per session per hour
preview_grant_ttl_seconds = 1800   # signed preview URLs live this long
chat_tail_messages = 60
interpreter_history_messages = 8   # recent turns given to the change interpreter

[code_generator.verification]
# off | best_effort | required. best_effort verifies in headless Chromium when it
# can launch; an unlaunchable browser is recorded in the receipt, never fatal.
browser = "best_effort"
viewports = [320, 390, 768, 1280]
browser_channel = ""               # "chrome" on a developer machine with Chrome installed
browser_executable = ""            # e.g. /usr/bin/chromium in a container image
page_timeout_seconds = 20.0
concurrency = 1

[artifact_storage]
# Existing packed-object coordinates retained for privacy cleanup of records
# created by earlier releases. Credentials remain in .env or the hosting
# provider secret store.
provider = "r2_s3"
endpoint_url = "https://d20ab3b9469c0c46731f758a03af4e3c.r2.cloudflarestorage.com"
bucket = "oryxenai-build-preparation"
region = "auto"
prefix = "temporary"
require_lifecycle = true
access_key_env = "R2_ACCESS_KEY_ID"
secret_key_env = "R2_SECRET_ACCESS_KEY"

[archive_storage]
# Compatibility paths only: deletion cleanup may remove outputs saved by
# previous releases. These paths do not enable a generation stage.
provider = "local_fs"
root = ".workspace/code-generator-preview"
prefix = "preview"
artifact_root = ".workspace/code-generator-artifacts"
generation_root = ".workspace/code-generator-generation"
checkpoint_root = ".workspace/code-generator-checkpoints"
workspace_root = ".workspace/code-generator-workspaces"
export_root = "output/code-gen-output"
handoff_root = ".workspace/build-preparation-staging"
handoff_mirror_root = "output/build-preparation"
