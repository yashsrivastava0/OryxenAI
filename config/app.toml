# OryxenAI application configuration (non-secret, committed).
# Secrets live ONLY in the root .env file. This file contains no credentials.
#
# Overlay files:
#   config/app.docker.toml  — Docker-specific overrides (loaded after this file)
#   config/app.test.toml     — test-specific overrides

[app]
name = "OryxenAI"
env = "local"          # local | staging | production
host = "127.0.0.1"     # bind host for direct uv run
port = 8000
log_level = "INFO"     # DEBUG | INFO | WARNING | ERROR
enable_dev_ui = true   # serve the developer testing harness at /

[database]
# Non-secret connection parameters. The PASSWORD is read from .env
# (POSTGRES_PASSWORD) and never appears here.
host = "localhost"
port = 5544
database = "oryxenai"
user = "oryxen"
# Optional full URL override. When non-empty, it is used verbatim.
url = ""

[database.pool]
# Pool settings for the async SQLAlchemy engine.
pool_size = 5          # number of persistent connections per process
max_overflow = 10      # additional connections allowed under load
pool_timeout = 30      # seconds to wait for a connection from the pool
pool_recycle = 3600    # seconds before a connection is recycled (-1 = never)

[worker]
# Background job worker settings.
polling_interval = 2.0        # seconds between poll cycles when idle
heartbeat_interval = 30.0     # seconds between heartbeat writes
claim_batch_size = 5           # max jobs claimed per poll
concurrency = 2                # max concurrent handlers (1 = serial)
shutdown_grace = 10.0          # seconds to finish active jobs at shutdown

[worker.job]
# Job execution behaviour.
handler_timeout = 300.0        # max seconds a handler may run
lease_duration = 120.0         # seconds before a claimed job is considered stale

[worker.retry]
# Retry scheduling for transient failures.
max_attempts = 3               # total attempts (1 initial + 2 retries)
base_delay = 1.0               # base delay in seconds (doubled each retry)
max_delay = 60.0               # cap on exponential backoff
jitter = true                  # add random jitter to retry delays

[api]
# API-level settings.
max_input_bytes = 262144       # 256 KB payload limit for request bodies

[diagnostics]
# Heartbeat monitoring.
heartbeat_staleness = 60.0     # seconds since last heartbeat before worker is stale

[discovery]
# Discovery agent output limits. Input is never validated.
max_questions = 8
max_projects = 8               # profile.projects is truncated to this, never rejected
max_answer_chars = 10000

[content_architect]
# Content Architect agent output limits. Input snapshot is never re-validated
# for business content — only shape/limits are enforced here.
max_routes = 12                # route_plan / page_content_packs truncated to this, never rejected

[visual_design_director]
# Visual Design Director agent output limits. Input snapshot (from Content
# Architect) is never re-validated for business content — only shape/limits
# enforced here.
max_pages = 12                     # pages truncated to this, never rejected
max_catalogue_candidates = 6       # resource-catalogue shortlist size per model call

[build_preparation]
# User-visible pre-code stage. Bundles live in private object storage, never on
# a shared application/worker filesystem.
max_routes = 12
bundle_ttl_days = 3
minimum_reuse_hours = 24
max_bundle_bytes = 67108864
network_timeout_seconds = 15.0
network_retry_count = 2
target_contract = "react-vite-v1"
fixture_enabled = true
fixture_input_path = "src/oryxenai/output/visual_design_director_Output.md"
fixture_output_dir = "output"
fixture_upload = true
fixture_reasoning_enabled = false
fixture_debug_mirror_enabled = true
debug_mirror_enabled = true
model_profile = "build_preparation"
reasoning_enabled = true
integration_route_threshold = 2
# Optional non-evidentiary editorial candidates; provider failure never blocks handoff.
editorial_image_budget = 1

[code_generator_development]
# Standalone Phase 1 developer workflow. It has no portfolio-session coupling.
enabled = true
input_root = ".workspace/code-generator-development"
fixture_map = { "privacy-safe-v3" = "tests/fixtures/code_generator_v3_privacy_safe", "privacy-safe-v3-rich" = "tests/fixtures/code_generator_v3_rich_privacy_safe" }
pack_version = "build-preparation-pack-v3"
schema_version = "build-preparation-contract-v3"
target_contract = "react-vite-v1"
planner_profile = "code_generator_planner"
max_upload_bytes = 16777216
max_uncompressed_bytes = 67108864
max_entries = 256
max_compression_ratio = 100.0
max_routes = 12
max_work_units = 64
max_events_page_size = 100

[code_generator_acquisition]
allowlist_image_providers = ["pexels", "unsplash"]
allowlist_font_formats = ["woff2", "woff"]
allowlist_icon_package = "lucide"
allowlist_component_registries = ["shadcn", "magicui"]
allowlist_style_kinds = ["pattern", "token_preset", "helper"]
forbidden_subject_terms = []
user_media_substitution_allowed = false
max_request_rounds = 4
image_max_bytes = 4194304
font_max_bytes = 2097152
icon_svg_max_bytes = 393216
component_max_bytes = 524288
style_max_bytes = 262144
materials_root = ".workspace/code-generator-materials"
prefer_resource_scout_model = false

[code_generator_generation]
scaffold_profile = "react-vite-v1"
scaffold_root = "src/oryxenai/agents/code_generator/scaffolds"
workspace_root = ".workspace/code-generator-generation"
checkpoint_root = ".workspace/code-generator-checkpoints"
foundation_profile = "code_generator_foundation_builder"
route_profile = "code_generator_route_builder"
compose_profile = "code_generator_route_composer"
integration_profile = "code_generator_integrator"
repair_profile = "code_generator_repairer"
max_file_bytes = 262144
max_response_bytes = 2097152
max_source_bytes = 8388608
max_request_rounds = 4
max_repair_rounds_per_unit = 2
max_repair_rounds_total = 6
max_route_batch_sections = 8
max_concurrency = 1
typecheck_timeout_seconds = 120.0
typecheck_command = ["npm.cmd", "run", "typecheck"]
format_command = []
use_real_typecheck = true

[code_generator_dependencies]
workspaces_root = ".workspace/code-generator-workspaces"
npm_executable = "npm.cmd"
npm_cache_root = ".workspace/npm-cache"
allow_network_install = false
allow_install_scripts = false

[code_generator_dependencies.supported_packages.lucide-react]
version_pin = "0.460.0"
transitive = ["react@19.0.0"]
licence = "ISC"

[code_generator_dependencies.supported_packages.motion]
version_pin = "12.0.0"
transitive = ["react@19.0.0"]
licence = "MIT"

[code_generator_verification]
# Standalone Phase 4 final build, DOM verification, and promoted preview.
enabled = true
profile_id = "code-generator-verification-v1"
browser_name = "chromium"
browser_executable = ""
browser_headless = true
browser_timeout_ms = 15000
install_timeout_seconds = 180.0
typecheck_timeout_seconds = 180.0
format_timeout_seconds = 60.0
build_timeout_seconds = 180.0
runtime_timeout_ms = 15000
max_output_bytes = 65536
max_artifact_bytes = 33554432
reject_source_maps = true
install_command = ["npm.cmd", "ci", "--ignore-scripts", "--offline", "--no-audit", "--no-fund"]
typecheck_command = ["npm.cmd", "run", "typecheck"]
format_command = []
build_command = ["npm.cmd", "run", "build"]
preview_root = ".workspace/code-generator-preview"
preview_base_url = "http://127.0.0.1:4174/preview"
preview_host = "127.0.0.1"
preview_port = 4174
preview_parent_origin = "http://127.0.0.1:8000"
preview_retention_days = 3
preview_route_prefix = "/preview"

[code_generator_verification.viewport_profiles]
mobile = { width = 390, height = 844 }
tablet = { width = 768, height = 1024 }
desktop = { width = 1440, height = 900 }

[artifact_storage]
# Non-secret coordinates for the configured private preparation bucket.
# Credentials remain in .env or the hosting provider secret store. A deployment
# overlay may replace these coordinates for another account/bucket.
provider = "r2_s3"
endpoint_url = "https://d20ab3b9469c0c46731f758a03af4e3c.r2.cloudflarestorage.com"
bucket = "oryxenai-build-preparation"
region = "auto"
prefix = "temporary"
require_lifecycle = true
access_key_env = "R2_ACCESS_KEY_ID"
secret_key_env = "R2_SECRET_ACCESS_KEY"

[resource_providers]
# Only configured, trusted sources may participate in execution enrichment.
# Animate UI is intentionally absent: its Commons-Clause licence is not
# approved for vendoring or distribution.
registries_enabled = true
# The public shadcn catalog is style-versioned.  The root /r/registry.json
# endpoint is not a public catalog.
shadcn_catalog_url = "https://ui.shadcn.com/r/styles/new-york-v4/registry.json"
shadcn_item_url_template = "https://ui.shadcn.com/r/styles/new-york-v4/{name}.json"
magicui_catalog_url = "https://magicui.design/r/registry.json"
magicui_item_url_template = "https://magicui.design/r/{name}.json"
magicui_enabled = true
aceternity_catalog_url = "https://ui.aceternity.com/registry/registry.json"
aceternity_item_url_template = "https://ui.aceternity.com/registry/{name}.json"
aceternity_enabled = false
registry_order = ["shadcn", "magicui"]
execution_provider_order = ["fontsource", "shadcn", "magicui", "motion_primitives", "lucide", "pexels"]
provider_cache_policy = "content_hash"
licence_policy = "permissive-local-vendoring-only"
fontsource_enabled = true
fontsource_api_base_url = "https://api.fontsource.org/v1"
fontsource_format = "woff2"
fontsource_latin_only = true
font_profiles = { editorial_technical = { display = "space-grotesk", body = "manrope", utility = "jetbrains-mono" }, neutral_systems = { display = "geist", body = "geist", utility = "jetbrains-mono" }, warm_technical = { display = "hanken-grotesk", body = "manrope", utility = "jetbrains-mono" } }
shadcn_release_pin = "new-york-v4"
magicui_release_pin = "registry-v1"
shadcn_allowed_components = ["accordion", "card", "dialog", "tabs", "tooltip"]
magicui_allowed_components = ["border-beam", "magic-card", "marquee"]
motion_primitives_enabled = true
motion_primitives_commit = "immutable-pin-required"
motion_primitives_allowed_components = ["cursor", "magnetic", "text-effect"]
animate_ui_enabled = false
pexels_api_key_env = "PEXELS_API_KEY"
unsplash_access_key_env = "UNSPLASH_ACCESS_KEY"
lucide_icon_url_template = "https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/{name}.svg"
