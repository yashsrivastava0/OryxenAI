# Direct OpenAI API route used by the detached Code Generator (and available
# to other explicitly configured stages). Keep it separate from the OpenCode-
# compatible Luna route so the credential and endpoint are explicit.
[profiles.openai_luna]
provider = "openai"
model = "gpt-5.6-luna"
display_name = "OpenAI — GPT-5.6 Luna"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 180
max_retries = 0
max_output_tokens = 24000
reasoning_effort = "medium"
prompt_cache_ttl = "30m"
pricing = { unit = "configured_credits_per_million_tokens", input_per_million = 5.0, cached_input_per_million = 0.5, cache_write_per_million = 6.25, output_per_million = 30.0 }
store = false

[profiles.openai_luna.capabilities]
json_object_mode = true
json_schema_mode = true
thinking_mode = true
structured_output_mode = "native_json_schema"
thinking_strategy = "adaptive"
# "output_config_effort" is Anthropic's own field name (read directly by
# providers/anthropic.py) and was copy-pasted here rather than tuned for
# this OpenAI-protocol profile. The OpenCodeGo/OpenAI adapter sends
# reasoning effort as a flat "reasoning_effort" Chat Completions parameter
# (providers/opencode_go.py), which is what this enum value names.
effort_parameter = "reasoning_effort"
reasoning_content = false
temperature_control = false
usage_metadata = true
response_id = true
context_cache_metadata = true
supports_store_parameter = true
uses_max_completion_tokens = true
supports_prompt_cache_key = true
supports_prompt_cache_options = true
supports_prompt_cache_breakpoint = true
