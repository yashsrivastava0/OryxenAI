[profiles.visual_design_director]
provider = "anthropic"
model = "claude-sonnet-5"
display_name = "Anthropic — Claude Sonnet 5"
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"
# 60s was too tight for direct_page_experience's per-route/per-scene
# storyboard generation — live-reproduced a guaranteed 3-attempt
# PROVIDER_TIMEOUT_ERROR failure loop. Matched to build_preparation's
# budget, which does comparably complex structured multi-item output.
timeout_seconds = 180
max_retries = 0
# 12000 was also too small — live-reproduced MODEL_OUTPUT_TRUNCATED on a
# real content-rich portfolio (multiple routes/case-studies): VDD's
# per-route storyboards, scenes, motion/interaction system, and asset
# intent genuinely need more room than a lighter single-brief agent like
# Discovery. Matched to build_preparation's budget for the same reason as
# the timeout above.
max_output_tokens = 24000
reasoning_effort = "low"
prompt_cache_ttl = "5m"
store = false

