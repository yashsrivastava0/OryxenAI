# OryxenAI provider-neutral model configuration (non-secret, committed).
#
# Discovery uses the configured profile only when a durable real operation is
# requested. The app and worker can start without any model key.
#
# Each profile describes how a ModelClient adapter should talk to its provider.
# OpenAI-compatible profiles use chat/completions; Anthropic profiles use the
# native Messages API. Agent code never references provider-specific variable
# names; it only knows the abstract ModelClient protocol.
#
# An API key is resolved INDIRECTLY: the profile names the environment
# variable that holds the key (api_key_env); the application reads that
# named secret from .env only when a real model call is eventually made.
#
# Set the matching environment variable in .env for real Discovery calls.
# Changing provider/base_url/model/api_key_env
# must NOT require edits to agent implementations or business logic.

[profiles.default]
provider = "openai_compatible"
model = ""
base_url = ""
api_key_env = ""        # e.g. "OPENCODE_GO_API_KEY" — name of the env var
request_params = {}     # extra request parameters (temperature, max_tokens, ...)

[profiles.discovery]
# Real OpenAI API (the same "gpt-5.6-luna" model is also reachable through
# the opencode_go provider/profile below, but that gateway's own monthly
# quota is a separate pool from this account's OpenAI credit). Override
# with ORA_SMOK_MODEL for a smoke comparison without changing committed
# configuration.
provider = "openai"
model = "gpt-5.6-luna"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 150
max_retries = 1
max_output_tokens = 32000
# Confirmed live: valid values are none/low/medium/high/xhigh. "low" cut
# reasoning-token overhead by ~70% in a direct comparison with near-identical
# visible output length — trims latency without shortening the deliverable
# content itself. Not "none": Discovery's task has real grounding/consistency
# requirements worth some reasoning budget.
reasoning_effort = "low"
store = false

# gpt-5.6-luna is a reasoning-family model on the real OpenAI endpoint:
# confirmed live that it rejects a non-default temperature and requires
# max_completion_tokens instead of max_tokens (OpenCode Go's gateway
# normalizes both away, which is why this only surfaced here). thinking_mode
# confirmed live too: reasoning_effort is a real, supported flat parameter.
[profiles.discovery.capabilities]
json_object_mode = true
json_schema_mode = false
thinking_mode = true
reasoning_content = false
temperature_control = false
usage_metadata = true
response_id = true
context_cache_metadata = false
supports_store_parameter = true
uses_max_completion_tokens = true

