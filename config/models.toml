# OryxenAI provider-neutral model configuration (non-secret, committed).
#
# Active model-backed engines use their configured profile only when a durable
# real operation is requested. The app and worker can start without a model
# key. The native development pipeline uses the selectable Luna profile below;
# Code Generator profiles retain their separate routes.
#
# Each profile describes how a ModelClient adapter should talk to its provider.
# Each adapter is selected by the provider-neutral ModelClient boundary. Agent
# code never references provider-specific variable names or model names.
#
# An API key is resolved INDIRECTLY: the profile names the environment
# variable that holds the key (api_key_env); the application reads that
# named secret from .env only when a real model call is eventually made.
#
# Set the matching environment variable in .env for real model calls.
# Changing provider/base_url/model/api_key_env
# must NOT require edits to agent implementations or business logic.

[routing]
fallback_profile = "default"
# Add a profile name here when it should become a safe UI/API selection.
selectable_profiles = ["openai_luna", "discovery_opencode_go"]

[routing.engine_profiles]
discovery = "experiential_luna"
content_architect = "experiential_luna"
visual_design_director = "experiential_luna"
build_preparation = "experiential_luna"
code_generator_director = "code_generator_director"
code_generator_planner = "code_generator_planner"
code_generator_resource_scout = "code_generator_resource_scout"
code_generator_route_builder = "code_generator_route_builder"
code_generator_route_composer = "code_generator_route_composer"
code_generator_integrator = "code_generator_integrator"
code_generator_repairer = "code_generator_repairer"

[routing.policy]
version = "precode_free_v1"
input_policy = "personal_luna_only"
utilization_ceiling = 0.8
wallet_spend_enabled = false
promotional_usage_enabled = true

[routing.capacity.sources.EXPLABS]
provider = "experiential"
credential_alias = "EXPLABS"
api_key_env = "EXPLABS_API_KEY"
base_url_env = "EXPLABS_BASE_URL"
# Optional non-secret organization identifier for Experiential usage rollups.
# Leave the environment variable unset to skip org-scoped reads while still
# reconciling the non-secret key list and effective key limits.
org_id_env = "EXPLABS_ORG_ID"
project_scope = "organization"
quota_group = "EXPLABS"
enabled = true
input_policy = "any"

[routing.capacity.sources.GEMINI_1]
provider = "gemini"
credential_alias = "GEMINI_1"
api_key_env = "GEMINI_API_KEY1"
base_url_env = ""
project_scope = "GEMINI_1"
quota_group = "GEMINI_1"
enabled = true
input_policy = "sanitized"

[routing.capacity.sources.GEMINI_2]
