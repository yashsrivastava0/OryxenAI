[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "oryxenai"
version = "0.1.0"
description = "OryxenAI Discovery workflow: FastAPI, PostgreSQL persistence, and durable model-backed discovery."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "OryxenAI" }]

dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "boto3>=1.35",
    "httpx>=0.27",
    "Pillow>=10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oryxenai"]

# ----------------------------------------------------------------------------
# uv
# ----------------------------------------------------------------------------
# The lockfile (uv.lock) is committed for reproducibility. No special tool.uv
# keys are required for this single-project workspace.
# ----------------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
cache-dir = ".workspace/cache/ruff"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function-default FastAPI Depends usage is intentional
    "S101",  # assert is fine in pytest tests, config-assert in non-test code is intentional too
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]  # allow pytest.raises patterns in tests
"migrations/**" = ["E402"]  # alembic env ordering

[tool.ruff.format]
docstring-code-format = true

# ----------------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
files = ["src"]
cache_dir = ".workspace/cache/mypy"

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
cache_dir = ".workspace/cache/pytest"
markers = [
    "integration: tests that require a live PostgreSQL database.",
    "strict_integration: integration tests that must NOT be skipped (CI fails if skipped).",
    "worker: tests that require a running background worker process.",
    "live: opt-in tests that call a real model provider; skipped unless RUN_LIVE_DISCOVERY=1 and a valid provider key is set.",
    "eval: deterministic evaluation-corpus tests over the golden scenario set.",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # asyncpg emits ResourceWarning from Connection.__del__ when the pooled
    # connection is garbage-collected after engine.dispose(). Engines are
    # always disposed in fixture teardown; this is GC-timing noise, not a leak.
    "ignore:unclosed connection.*asyncpg:ResourceWarning",
]
