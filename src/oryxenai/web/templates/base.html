<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }} - Portfolio Discovery{% endblock %}</title>
  <link rel="stylesheet" href="{{ request.scope.get('root_path', '') }}/static/app.css?v={{ app_css_version }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1>{{ app_name }}</h1>
    <p class="subtitle">Tell us about yourself and we'll put together a portfolio brief with you.</p>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>{{ app_name }} - Discovery, Content Architect &amp; Visual Design Director. Code generation is not invoked yet.</p>
  </footer>

  <script src="{{ request.scope.get('root_path', '') }}/static/app.js?v={{ app_js_version }}"></script>
</body>
</html>
