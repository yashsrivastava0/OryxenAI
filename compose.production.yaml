# Azure VM production overlay.
#
# The repository's azure-deploy.sh script creates the ignored
# config/app.production.local.toml file and sets ORYXENAI_IMAGE_TAG to the
# exact release SHA before invoking this overlay. Caddy is part of the same
# Compose project so the VM needs no native reverse-proxy installation.

services:
  migrate:
    environment:
      OryxenAI_CONFIG_OVERLAY: config/app.production.local.toml
  app:
    environment:
      OryxenAI_CONFIG_OVERLAY: config/app.production.local.toml
  worker:
    environment:
      OryxenAI_CONFIG_OVERLAY: config/app.production.local.toml
  preview-gateway:
    environment:
      OryxenAI_CONFIG_OVERLAY: config/app.production.local.toml

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: local
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - oryxen_caddy_data:/data
      - oryxen_caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
      preview-gateway:
        condition: service_healthy

volumes:
  oryxen_caddy_data:
  oryxen_caddy_config:
