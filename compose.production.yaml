# Single-VM production Compose stack.
#
# Topology:
#   PostgreSQL -> migrate -> app + worker -> Caddy
#
# This file is intentionally self-contained. The development-only
# compose.yaml keeps host loopback ports; production publishes only Caddy on
# ports 80 and 443.
#
# Every durable path is a bind mount below ORYXENAI_DATA_ROOT. The VM setup
# command creates these directories with the UID/GID expected by each image;
# do not replace them with anonymous volumes or container-local paths.

name: oryxenai

x-default-logging: &default-logging
  driver: local

x-application: &application
  image: oryxenai:${ORYXENAI_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  logging: *default-logging
  env_file:
    - ${ORYXENAI_ENV_FILE:-.env}
  environment:
    DB_HOST_OVERRIDE: postgres
    DB_PORT_OVERRIDE: "5432"
    OryxenAI_CONFIG_OVERLAY: ${OryxenAI_CONFIG_OVERLAY:-config/app.production.local.toml}
  networks:
    - backend

services:
  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: oryxenai
      POSTGRES_USER: oryxen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - type: bind
        source: "${ORYXENAI_DATA_ROOT:-/srv/oryxenai}/postgres"
        target: /var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oryxen -d oryxenai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    <<: *application
    restart: "no"
    # The image has an HTTP healthcheck for long-running services; a one-shot
    # migration must not be reported as unhealthy after it exits successfully.
    healthcheck:
      disable: true
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *application
    # --forwarded-allow-ips is safe as "*" here only because `app` publishes
    # no host port -- Caddy is the only container that can reach it at all,
    # and therefore the sole caller able to set X-Forwarded-For. Without
    # this flag, request.client.host (and therefore any IP-based rate
    # limiting) would see Caddy's container IP for every request instead of
    # the real client.
    command: ["uvicorn", "oryxenai.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    volumes:
      # Reuse existing storage only for account/project deletion cleanup.
      - type: bind
        source: "${ORYXENAI_DATA_ROOT:-/srv/oryxenai}/preview"
        target: /app/.workspace/archive-storage
      - type: bind
        source: "${ORYXENAI_DATA_ROOT:-/srv/oryxenai}/code-generator-artifacts"
        target: /app/.workspace/archive-artifacts
      - type: bind
        source: "${ORYXENAI_DATA_ROOT:-/srv/oryxenai}/code-generator-generation"
        target: /app/.workspace/archive-generation
      - type: bind
        source: "${ORYXENAI_DATA_ROOT:-/srv/oryxenai}/code-generator-checkpoints"
        target: /app/.workspace/archive-checkpoints
      - type: bind
        source: "${ORYXENAI_DATA_ROOT:-/srv/oryxenai}/code-generator-workspaces"
        target: /app/.workspace/archive-workspaces
      - type: bind
        source: "${ORYXENAI_DATA_ROOT:-/srv/oryxenai}/code-gen-output"
        target: /app/output/archive-exports
      - type: bind
        source: "${ORYXENAI_DATA_ROOT:-/srv/oryxenai}/build-preparation-staging"
        target: /app/.workspace/archive-handoffs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    <<: *application
    command: ["python", "-m", "oryxenai.jobs.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from sqlalchemy import text; from oryxenai.core.settings import get_settings; from oryxenai.db.session import get_engine; import asyncio; e = get_engine(get_settings()); asyncio.run(e.connect().__aenter__()); asyncio.run(e.dispose())\""]
      interval: 15s
      timeout: 10s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    # The pinned upstream image has no named caddy account. Force its process
    # to the same non-root service identity used by the application image;
    # NET_BIND_SERVICE is the only extra capability needed for 80/443.
    user: "1001:1001"
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ${ORYXENAI_ENV_FILE:-.env}
    environment:
      APP_HOST: ${APP_HOST:?APP_HOST must be set in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: "${ORYXENAI_DATA_ROOT:-/srv/oryxenai}/caddy/data"
        target: /data
      - type: bind
        source: "${ORYXENAI_DATA_ROOT:-/srv/oryxenai}/caddy/config"
        target: /config
    networks:
      - backend
      - edge
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

networks:
  # backend is a normal (non-internal) bridge network: it needs outbound
  # internet routing so `app`/`worker`/`migrate` can reach Supabase and model
  # providers. It is not reachable from outside the Docker host because none
  # of those services publish a host `ports:` mapping -- only `caddy` does. An
  # earlier revision marked this network `internal: true`, which also
  # blocked all outbound egress and broke exactly those live calls; see
  # DECISIONS.md D-109.
  backend:
  edge:
