name: CI

# Full verification runs on `staging` (the gate) and on pull requests.
# On `deployment`, the same commit is normally a fast-forward of a staging SHA
# that already passed; `gate` detects that and skips the heavy jobs. A SHA that
# never went green on staging falls back to the full suite.
on:
  push:
    branches: [staging, deployment]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

# Cancel superseded runs, but never cancel a release run on `deployment`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/deployment' }}

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Gate (reuse staging result)
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.check.outputs.verified }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for a green staging run of this exact SHA
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/deployment" ]; then
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=50" \
              --jq '[.workflow_runs[] | select(.head_branch == "staging" and .conclusion == "success")] | length')
            if [ "${count:-0}" -gt 0 ]; then
              verified=true
            fi
          fi
          echo "verified=${verified}" >> "$GITHUB_OUTPUT"
          echo "Staging-verified SHA: ${verified}"

      - name: Detect Docker-relevant changes
        id: filter
        # Plain git diff: the repository only allows a short list of actions.
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-$BEFORE}"
          docker=true
          if [ -n "$base" ] && ! echo "$base" | grep -qE '^0+$' && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$base" HEAD | grep -qE '^(Dockerfile|compose[^/]*\.ya?ml|config/|pyproject\.toml|uv\.lock|migrations/|src/|frontend/|\.github/workflows/ci\.yml)'; then
              docker=false
            fi
          fi
          echo "docker=${docker}" >> "$GITHUB_OUTPUT"
          echo "Docker-relevant change: ${docker}"

  backend:
    name: Backend lint and types
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.13
      - run: uv sync --frozen --all-groups --extra pdf-full
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy type check
        run: uv run mypy src

  frontend:
    name: Frontend checks
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Type check
        run: npm run typecheck
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  tests:
    name: Migrations and pytest
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: oryxenai
          POSTGRES_USER: oryxen
          POSTGRES_PASSWORD: oryxen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oryxen -d oryxenai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_PASSWORD: oryxen_test
      # Deliberately NOT setting the test overlay here: tests/conftest.py's
      # autouse `_set_test_overlay` fixture scopes it to integration/worker
      # tests; a process-wide value would leak into unit tests that assert
      # config/app.toml defaults.

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.13
      - run: uv sync --frozen --all-groups --extra pdf-full

      - name: Install verifier browser
        run: uv run playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Frontend build (served by browser tests)
        run: npm run build
        working-directory: frontend

      - name: Create test database
        run: |
          PGPASSWORD=oryxen_test psql -h localhost -U oryxen -d oryxenai -c "CREATE DATABASE oryxenai_test;" || true

      - name: Run database migrations (application DB)
        run: uv run alembic upgrade head
        env:
          # Keep migrations off oryxenai_test: its fixtures create/drop schema.
          DATABASE_URL: postgresql+asyncpg://oryxen:oryxen_test@127.0.0.1:5432/oryxenai

      - name: Run tests (all, strict integration)
        run: uv run pytest -v --strict-markers

  audit:
    name: Dependency audit and secret scan
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.13
      - run: uv sync --frozen --all-groups --extra pdf-full
      - name: Dependency audit
        run: uv run pip-audit --local
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --no-git --verbose --redact

  docker-smoke:
    name: Docker build and smoke test
    needs: gate
    if: needs.gate.outputs.verified != 'true' && (needs.gate.outputs.docker == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: oryxen_test
    steps:
      - uses: actions/checkout@v4

      - name: Prepare throwaway .env for dev Compose smoke test
        # compose.yaml services declare `env_file: .env`, which must exist.
        # POSTGRES_PASSWORD must match the job-level value (Compose substitutes
        # it from the host shell for postgres, from .env for app/worker/migrate).
        # config/app.docker.toml sets [auth] required = true, which needs two
        # valid bootstrap admin emails and non-blank Supabase coordinates at
        # startup; fake values suffice because no real verification happens.
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
          echo "ORYXENAI_ADMIN_BOOTSTRAP_EMAILS=ci-admin-1@example.com,ci-admin-2@example.com" >> .env
          echo "SUPABASE_URL=https://ci-smoke-test.supabase.co" >> .env
          echo "SUPABASE_PUBLISHABLE_KEY=ci-smoke-test-publishable-key" >> .env
          echo "SUPABASE_SECRET_KEY=ci-smoke-test-secret-key" >> .env

      - name: Docker build
        run: docker compose build --build-arg PDF_ENGINE=light

      - name: Docker smoke test
        run: |
          docker compose up -d --wait --wait-timeout 600 app worker
          curl -fsS http://localhost:8000/health/live
          curl -fsS http://localhost:8000/health/ready
          # /api/v1/system/status is admin-gated; with no real session the
          # correct response is 401. Assert the route enforces auth.
          status_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/system/status)
          if [ "$status_code" != "401" ]; then
            echo "Expected /api/v1/system/status to require authentication (401), got $status_code" >&2
            exit 1
          fi
          docker compose down -t 5

      - name: Dump Compose logs on smoke test failure
        if: failure()
        run: docker compose logs --no-color migrate app worker postgres || true

      - name: Remove throwaway .env
        if: always()
        run: rm -f .env

  # Aggregate required check. Job id and display name are unchanged from the
  # old single job so the branch ruleset's required `quality` check still
  # resolves. Always runs, so skipped jobs never leave it pending.
  quality:
    name: Lint, type-check, test, audit
    needs: [gate, backend, frontend, tests, audit, docker-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        env:
          VERIFIED: ${{ needs.gate.outputs.verified }}
          GATE: ${{ needs.gate.result }}
          RESULTS: ${{ needs.backend.result }} ${{ needs.frontend.result }} ${{ needs.tests.result }} ${{ needs.audit.result }} ${{ needs.docker-smoke.result }}
        run: |
          if [ "$GATE" != "success" ]; then
            echo "Gate failed: $GATE" >&2
            exit 1
          fi
          if [ "$VERIFIED" = "true" ]; then
            echo "SHA already passed full CI on staging; heavy jobs skipped."
            exit 0
          fi
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "A required job did not succeed ($r)." >&2
              exit 1
            fi
          done
