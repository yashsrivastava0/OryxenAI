name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, type-check, test, audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: oryxenai
          POSTGRES_USER: oryxen
          POSTGRES_PASSWORD: oryxen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oryxen -d oryxenai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_PASSWORD: oryxen_test
      # Deliberately NOT set at job level: tests/conftest.py's autouse
      # `_set_test_overlay` fixture already scopes this overlay to only
      # integration/worker-marked tests via monkeypatch (auto-reverted per
      # test). Setting it process-wide here leaks into every plain unit
      # test too -- including ones that assert config/app.toml's own
      # defaults -- and monkeypatch.setenv cannot "unset" an ambient value
      # it didn't set. Set it explicitly only on the one step that needs it
      # outside of pytest: the migration step below.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Azure deployment script syntax
        run: bash -n scripts/azure-deploy.sh

      - name: Validate production Compose configuration
        run: |
          set -eu
          trap 'rm -f .env config/app.production.local.toml' EXIT
          cp .env.example .env
          # .env.example intentionally ships POSTGRES_PASSWORD blank (no
          # working weak default); Compose config validation only checks
          # syntax/interpolation here, so a throwaway value is enough.
          echo "POSTGRES_PASSWORD=ci-config-check-only" >> .env
          cp config/app.production.toml config/app.production.local.toml
          sed -i \
            -e 's/<APP_HOST>/app.example.com/g' \
            -e 's/<PREVIEW_HOST>/preview.example.com/g' \
            config/app.production.local.toml
          docker compose -f compose.production.yaml config --quiet

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies from lockfile
        run: uv sync --frozen --all-groups

      - name: Install verifier browser
        run: uv run playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend type check
        run: npm run typecheck
        working-directory: frontend

      - name: Frontend unit tests
        run: npm test
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Warm Code Generator offline npm cache
        # tests/integration/test_code_generator_verification_worker.py
        # ::test_verification_builds_and_promotes_a_clean_candidate runs a
        # real (unmocked) `npm ci --offline` against the react-vite-v1
        # scaffold. That command reads config's npm_cache_root
        # (.workspace/npm-cache), which starts empty on a fresh runner --
        # npm's ERESOLVE peer-dependency warnings for the optional
        # @tailwindcss/oxide-wasm32-wasi variant are cosmetic and did not
        # cause CI failures; the real, previously-truncated failure was
        # ENOTCACHED on an unrelated package because nothing had ever
        # warmed this cache here. Mirrors scripts/warm-npm-cache.ps1's
        # already-established pattern (a disposable copy, never the
        # scaffold's own checked-in node_modules) as a portable CI step,
        # since that script is Windows-only and has no CI equivalent.
        run: |
          set -eu
          warm="$RUNNER_TEMP/code-generator-npm-warm"
          mkdir -p "$warm"
          cp src/oryxenai/agents/code_generator/scaffolds/react-vite-v1/package.json "$warm/"
          cp src/oryxenai/agents/code_generator/scaffolds/react-vite-v1/package-lock.json "$warm/"
          npm install --prefix "$warm" --cache "$GITHUB_WORKSPACE/.workspace/npm-cache" --ignore-scripts --no-audit --no-fund

      - name: Create test database
        run: |
          PGPASSWORD=oryxen_test psql -h localhost -U oryxen -d oryxenai -c "CREATE DATABASE oryxenai_test;" || true

      - name: Run database migrations (application DB)
        run: uv run alembic upgrade head
        env:
          OryxenAI_CONFIG_OVERLAY: config/app.test.toml

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy src

      - name: Run tests (all, strict integration)
        run: uv run pytest -v --strict-markers

      - name: Dependency audit
        run: uv run pip-audit --local

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git --verbose --redact

      - name: Docker build
        run: docker compose build

      - name: Docker smoke test
        run: |
          docker compose up -d --wait --wait-timeout 1800 app worker preview-gateway
          curl -fsS http://localhost:8000/health/live
          curl -fsS http://localhost:8000/health/ready
          curl -fsS http://localhost:8000/api/v1/system/status
          docker compose down -t 5

  deploy:
    name: Deploy to Azure VM
    needs: quality
    # TEMPORARILY force-disabled (2026-09-22): the operator wanted all
    # pending local commits pushed to GitHub without triggering a live
    # deploy yet ("push everything" + "do not deploy" in the same
    # instruction). Delete the leading `false &&` below to re-enable
    # automatic deploy-on-push before running the first real deployment
    # trial. See docs/deployment/ci-cd-runbook.md.
    if: >
      false &&
      github.ref == 'refs/heads/deployment' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, azure-oryxenai]
    # Fully automatic for now (D-110): no required-reviewer gate. Re-add
    # `environment: production` here (and create that Environment with a
    # required reviewer in Settings -> Environments) to require one manual
    # approval click per deploy again.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: /home/oryxenaiadmin/oryxenai
    steps:
      # No actions/checkout here: azure-deploy.sh deploy does its own
      # `git fetch origin` + `git checkout --detach <sha>` in place inside
      # the VM's persistent repo directory (see resolve_release()/deploy()
      # in scripts/azure-deploy.sh) -- the same thing a human runs by hand.
      - name: Deploy
        run: ./scripts/azure-deploy.sh deploy ${{ github.sha }}

      - name: Verify
        run: ./scripts/azure-deploy.sh verify

      - name: Dump status and recent logs on failure
        if: failure()
        run: |
          ./scripts/azure-deploy.sh status
          ./scripts/azure-deploy.sh logs
