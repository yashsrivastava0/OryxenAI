name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, type-check, test, audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: oryxenai
          POSTGRES_USER: oryxen
          POSTGRES_PASSWORD: oryxen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oryxen -d oryxenai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_PASSWORD: oryxen_test
      # The GitHub service container is published on 5432. Local Compose
      # deliberately uses 5544, so CI must override the host-side port.
      DB_PORT_OVERRIDE: 5432
      OryxenAI_CONFIG_OVERLAY: config/app.test.toml

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
        # The hosted cache service returned HTTP 400 in this repository. CI
        # remains deterministic without the optional uv package cache.

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies from lockfile
        run: uv sync --frozen --all-groups

      - name: Install verifier browser
        run: uv run playwright install --with-deps chromium

      - name: Create test database
        run: |
          PGPASSWORD=oryxen_test psql -h localhost -U oryxen -d oryxenai -c "CREATE DATABASE oryxenai_test;" || true

      - name: Run database migrations (application DB)
        run: uv run alembic upgrade head

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy src

      - name: Run tests (all, strict integration)
        run: uv run pytest -v --strict-markers
        env:
          OryxenAI_CONFIG_OVERLAY: config/app.test.toml

      - name: Dependency audit
        run: uv run pip-audit --local

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git --verbose --redact

      - name: Create CI Docker environment
        run: |
          # Docker Compose loads .env for its env_file entries. These values
          # are disposable CI placeholders, never production credentials.
          # Keep this step after the secret scan so the placeholders are not
          # mistaken for repository secrets.
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=oryxen_test
          SUPABASE_URL=https://ci-auth.invalid
          SUPABASE_PUBLISHABLE_KEY=ci_publishable_key
          SUPABASE_SECRET_KEY=ci_secret_key
          ORYXENAI_ADMIN_BOOTSTRAP_EMAILS=ci-admin-one@example.com,ci-admin-two@example.com
          R2_ACCESS_KEY_ID=ci_r2_access_key
          R2_SECRET_ACCESS_KEY=ci_r2_secret_key
          EOF

      - name: Docker build
        run: docker compose build

      - name: Docker smoke test
        run: |
          docker compose up -d
          sleep 20
          curl -fsS http://localhost:8000/health/live
          curl -fsS http://localhost:8000/health/ready
          curl -fsS http://localhost:8000/api/v1/system/status
          docker compose down -t 5
